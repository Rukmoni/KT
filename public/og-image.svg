  <text x='1095' y='220' font-family='Inter, system-ui, sans-serif' font-size='12' font-weight='600' fill='#F1F5F9' text-anchor='middle'>PSM I · CSPO®</text>

  <rect x='740' y='430' width='150' height='30' rx='15' fill='#12121A' stroke='#1E1E2E' stroke-width='1'/>
  <text x='815' y='450' font-family='Inter, system-ui, sans-serif' font-size='12' font-weight='600' fill='#F1F5F9' text-anchor='middle'>25 Years Delivery</text>

  <rect x='1020' y='390' width='120' height='30' rx='15' fill='#12121A' stroke='#1E1E2E' stroke-width='1'/>
  <text x='1080' y='410' font-family='Inter, system-ui, sans-serif' font-size='12' font-weight='600' fill='#F1F5F9' text-anchor='middle'>KL · Global</text>
