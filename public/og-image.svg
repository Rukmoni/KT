  <rect x='750' y='110' width='130' height='30' rx='15' fill='#12121A' stroke='#1E1E2E' stroke-width='1'/>
  <text x='815' y='130' font-family='Inter, system-ui, sans-serif' font-size='12' font-weight='600' fill='#F1F5F9' text-anchor='middle'>PMP® Certified</text>

