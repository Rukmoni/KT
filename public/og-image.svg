  <text x='210' y='420' font-family='JetBrains Mono, monospace' font-size='32' font-weight='700' fill='#06B6D4'>35%</text>
  <text x='210' y='445' font-family='Inter, system-ui, sans-serif' font-size='12' fill='#94A3B8'>OTD Improvement</text>

  <text x='330' y='420' font-family='JetBrains Mono, monospace' font-size='32' font-weight='700' fill='#06B6D4'>30%</text>
