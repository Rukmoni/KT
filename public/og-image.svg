      <stop offset='0%' stop-color='#7C3AED' stop-opacity='0.35'/>
      <stop offset='100%' stop-color='#0A0A0F' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='glow2' cx='75%' cy='50%' r='40%'>
